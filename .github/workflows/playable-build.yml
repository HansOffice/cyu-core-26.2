name: Playable Build

on:
  push:
    branches:
      - feat/playable-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build test binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Build Linux amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o dist/cyu-core-26.2-linux-amd64 .

      - name: Build Windows amd64
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o dist/cyu-core-26.2-windows-amd64.exe .

      - name: Include test config
        run: cp config.yml dist/config.yml

      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: cyu-core-26.2-playable-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
