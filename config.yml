# cyu-core 26.2 原生游戏服务端配置

server:
  # 服务端监听端口
  # 默认 25577，局域网或公网直接连接此端口
  port: 25577

  # 最大允许在线玩家数
  max_players: 100

  # 客户端服务器列表中展示的核心版本标识
  version_name: "&bCyuCore &726.2"

motd:
  # 客户端列表第一行 MOTD
  line1: "&b&lCyuCore 26.2 &8| &7Go 原生全自研游戏核心"
  # 客户端列表第二行 MOTD
  line2: "&a✔ 原生游戏世界就绪 &8› &eTPS 20.0 &8› &f直连进入"

world:
  # 玩家默认出生点坐标
  spawn_x: 8.5
  spawn_y: 65.0
  spawn_z: 8.5

  # 玩家默认游戏模式（0: 生存模式, 1: 创造模式）
  gamemode: 1

  # 出生点悬空平台的方块类型 ID（1 为石头，也可以是其他方块）
  platform_block: 1
